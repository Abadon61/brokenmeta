name = "discord-notify-worker"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# BROADCAST_SECRET is NOT set here (never commit a secret to a config file
# that goes to git) -- set it once with:
#   npx wrangler secret put BROADCAST_SECRET
# CORS_ORIGIN is not secret, just here for clarity that it's configurable.
[vars]
CORS_ORIGIN = "https://brokenmeta.gg"

# Created once with `npx wrangler kv namespace create WEBHOOKS` -- paste the
# id it prints below before the first `wrangler deploy`. Each key is a
# subscriber's own Discord webhook URL (already unguessable -- Discord bakes
# a token into the URL itself, see src/index.ts's DISCORD_WEBHOOK_RE), value
# is just an ISO timestamp of when they subscribed.
[[kv_namespaces]]
binding = "WEBHOOKS"
id = "REPLACE_WITH_REAL_KV_NAMESPACE_ID"
