<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CoreMeta — Analyse de partie</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0b0221; --bg-2: #170a3d; --row: #170a3d; --row-hover: #200f52;
    --border: #3d1f7a; --border-bright: #6b3fc9;
    --magenta: #ff2d95; --cyan: #05d9e8; --gold: #ffc23c; --teal: #2de6c4; --gray: #9a8fc4;
    --cream: #f3eeff; --text-dim: #b7a9e0; --text-faint: #6f5fa8;
    --good: #2de6c4; --warn: #ff3864;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(ellipse 900px 480px at 50% -8%, rgba(255,45,149,0.20), transparent 62%), var(--bg);
    color: var(--cream); font-family: 'Barlow', system-ui, sans-serif; min-height: 100vh;
  }
  .nums { font-family: 'Space Mono', monospace; font-variant-numeric: tabular-nums; }
  button, select, input { font-family: inherit; }

  .topbar { padding: 22px 24px 14px; max-width: 760px; margin: 0 auto; border-bottom: 1px solid var(--border); }
  .wordmark { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; }
  .wordmark .meta { background: linear-gradient(90deg, var(--magenta), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .subtitle { font-size: 12px; color: var(--text-faint); font-family: 'Space Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }

  .page { max-width: 760px; margin: 0 auto; padding: 24px 20px 70px; }

  .lookup-form { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .lookup-form input[type="text"] {
    flex: 1; min-width: 220px; background: var(--row); border: 1px solid var(--border);
    color: var(--cream); padding: 11px 14px; font-size: 14px;
  }
  .lookup-form select {
    background: var(--row); border: 1px solid var(--border); color: var(--cream); padding: 11px 14px; font-size: 14px;
  }
  .lookup-form button {
    background: var(--magenta); border: none; color: #fff; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; font-size: 12px; padding: 0 20px; cursor: pointer;
  }
  .lookup-form button:disabled { opacity: 0.5; cursor: default; }
  .hint { font-size: 11.5px; color: var(--text-faint); margin-bottom: 26px; }
  .error-box { background: rgba(255,56,100,0.1); border: 1px solid var(--warn); color: var(--cream); padding: 12px 16px; font-size: 13px; margin-bottom: 20px; }

  .section-title {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--cyan); margin: 26px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .match-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
  .match-row {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    padding: 7px 4px; background: var(--row); border: 1px solid var(--border); cursor: pointer;
  }
  .match-row:hover { background: var(--row-hover); border-color: var(--border-bright); }
  .match-row[data-active="true"] { border-color: var(--cyan); background: var(--row-hover); }
  .match-placement {
    width: 22px; height: 22px; flex: none; display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; color: #0b0221;
  }
  .match-placement.win { background: var(--good); }
  .match-placement.loss { background: var(--warn); }
  .match-level { font-size: 10px; color: var(--text-dim); font-family: 'Space Mono', monospace; }

  .report-header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 16px 18px; background: var(--row); border: 1px solid var(--border); margin-bottom: 8px; }
  .report-carry { width: 54px; height: 54px; object-fit: cover; border: 2px solid var(--border-bright); flex: none; }
  .report-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; text-transform: uppercase; }
  .report-meta { font-size: 12px; color: var(--text-faint); font-family: 'Space Mono', monospace; margin-top: 3px; }

  .report-board { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0; }
  .board-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 52px; }
  .board-unit img.champ { width: 52px; height: 52px; object-fit: cover; border: 2px solid var(--cost-color, var(--gray)); }
  .board-unit .items { display: flex; gap: 2px; min-height: 16px; }
  .board-unit .items img { width: 16px; height: 16px; border: 1px solid var(--border-bright); object-fit: cover; }

  .insight-list { display: flex; flex-direction: column; gap: 10px; }
  .insight-row { display: flex; gap: 12px; padding: 12px 16px; background: var(--row); border-left: 3px solid var(--tc); font-size: 13.5px; line-height: 1.5; }
  .insight-row[data-type="good"] { --tc: var(--good); }
  .insight-row[data-type="warning"] { --tc: var(--warn); }
  .insight-row[data-type="info"] { --tc: var(--cyan); }
  .insight-category { font-family: 'Space Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--tc); flex: none; width: 78px; padding-top: 1px; }
  .insight-text { color: var(--text-dim); }

  .lobby-list { display: flex; flex-direction: column; gap: 6px; }
  .lobby-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--row); border: 1px solid var(--border); flex-wrap: wrap; }
  .lobby-row[data-counter="true"] { border-color: var(--warn); }
  .lobby-placement {
    width: 24px; height: 24px; flex: none; display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; color: #0b0221;
  }
  .lobby-placement.win { background: var(--good); }
  .lobby-placement.loss { background: var(--warn); }
  .lobby-carry { width: 30px; height: 30px; object-fit: cover; border: 1px solid var(--border-bright); flex: none; }
  .lobby-info { flex: 1; min-width: 120px; }
  .lobby-name { font-size: 12.5px; font-weight: 600; }
  .lobby-comp { font-size: 11px; color: var(--text-faint); font-family: 'Space Mono', monospace; }
  .lobby-counter-tag {
    font-family: 'Space Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--warn); border: 1px solid var(--warn); padding: 3px 8px; flex: none;
  }

  .loading { color: var(--text-faint); font-size: 13px; padding: 12px 0; }
  footer { max-width: 760px; margin: 40px auto 0; padding: 16px 20px 0; font-size: 10.5px; color: var(--text-faint); font-family: 'Space Mono', monospace; border-top: 1px solid var(--border); }
</style>
</head>
<body>

<div class="topbar">
  <div class="wordmark">Core<span class="meta">Meta</span></div>
  <div class="subtitle">Analyse de partie</div>
</div>

<div class="page">
  <div class="lookup-form">
    <input type="text" id="riotIdInput" placeholder="Pseudo#TAG" autocomplete="off" />
    <select id="regionSelect">
      {% for r in regions %}<option value="{{ r }}">{{ r }}</option>{% endfor %}
    </select>
    <button id="lookupButton">Chercher</button>
  </div>
  <div class="hint">Entre ton Riot ID (le pseudo suivi de #TAG, visible dans le client) et ta région. On récupère tes 10 dernières parties classées en direct depuis l'API Riot — rien n'est stocké au-delà du cache technique déjà utilisé pour le reste de CoreMeta.</div>

  <div id="errorBox"></div>
  <div id="matchSection"></div>
  <div id="reportSection"></div>
</div>

<footer id="footer"></footer>

<script>
const lookupButton = document.getElementById('lookupButton');
const riotIdInput = document.getElementById('riotIdInput');
const regionSelect = document.getElementById('regionSelect');
const errorBox = document.getElementById('errorBox');
const matchSection = document.getElementById('matchSection');
const reportSection = document.getElementById('reportSection');

function pct(x) { return Math.round(x * 100) + '%'; }
function showError(msg) { errorBox.innerHTML = `<div class="error-box">${msg}</div>`; }
function clearError() { errorBox.innerHTML = ''; }

async function doLookup() {
  const riotId = riotIdInput.value.trim();
  const region = regionSelect.value;
  if (!riotId.includes('#')) { showError('Format attendu : Pseudo#TAG'); return; }
  clearError();
  reportSection.innerHTML = '';
  matchSection.innerHTML = '<div class="loading">Recherche du joueur et de ses parties récentes…</div>';
  lookupButton.disabled = true;
  try {
    const res = await fetch('/api/matches', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ riotId, region }),
    });
    const data = await res.json();
    if (!res.ok) { showError(data.error || 'Erreur inconnue.'); matchSection.innerHTML = ''; return; }
    renderMatches(data);
  } catch (e) {
    showError('Impossible de contacter le serveur local.');
    matchSection.innerHTML = '';
  } finally {
    lookupButton.disabled = false;
  }
}

function renderMatches(data) {
  if (!data.matches.length) {
    matchSection.innerHTML = `<div class="section-title">Parties récentes</div><div class="loading">Aucune partie classée trouvée pour ${data.riotId}.</div>`;
    return;
  }
  matchSection.innerHTML = `
    <div class="section-title">Parties récentes de ${data.riotId} — choisis-en une</div>
    <div class="match-list">
      ${data.matches.map(m => `<div class="match-row" data-match-id="${m.matchId}" tabindex="0" role="button" aria-label="Partie : placement ${m.placement}, niveau ${m.level ?? '?'}">
        <span class="match-placement ${m.placement <= 4 ? 'win' : 'loss'}">${m.placement}</span>
        <span class="match-level">Niveau ${m.level ?? '?'}</span>
      </div>`).join('')}
    </div>
  `;
  matchSection.querySelectorAll('.match-row').forEach(row => {
    row.addEventListener('click', () => {
      matchSection.querySelectorAll('.match-row').forEach(r => r.dataset.active = 'false');
      row.dataset.active = 'true';
      analyzeMatch(data.puuid, data.region, row.dataset.matchId);
    });
    row.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); row.click(); } });
  });
}

async function analyzeMatch(puuid, region, matchId) {
  reportSection.innerHTML = '<div class="loading">Analyse de la partie…</div>';
  clearError();
  try {
    const res = await fetch('/api/analyze', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ puuid, region, matchId }),
    });
    const data = await res.json();
    if (!res.ok) { showError(data.error || 'Erreur inconnue.'); reportSection.innerHTML = ''; return; }
    renderReport(data);
  } catch (e) {
    showError('Impossible de contacter le serveur local.');
    reportSection.innerHTML = '';
  }
}

function renderReport(r) {
  reportSection.innerHTML = `
    <div class="report-header">
      ${r.carryIcon ? `<img class="report-carry" src="${r.carryIcon}" alt="${r.carry}" />` : ''}
      <div>
        <div class="report-title">${r.compLabel}</div>
        <div class="report-meta">Placement ${r.placement} · Niveau ${r.level ?? '?'} · ${r.goldLeft ?? '?'} or restant · round ${r.lastRound ?? '?'}</div>
      </div>
    </div>
    <div class="report-board">
      ${r.units.map(u => `<div class="board-unit">
        ${u.icon ? `<img class="champ" src="${u.icon}" alt="${u.champion}" title="${u.champion}" style="--cost-color:${u.star >= 3 ? 'var(--gold)' : 'var(--gray)'}" />` : ''}
        <div class="items">${u.itemIcons.filter(Boolean).map(src => `<img src="${src}" />`).join('')}</div>
      </div>`).join('')}
    </div>
    <div class="section-title">Bilan</div>
    <div class="insight-list">
      ${r.insights.map(i => `<div class="insight-row" data-type="${i.type}">
        <span class="insight-category">${i.category}</span>
        <span class="insight-text">${i.text}</span>
      </div>`).join('')}
    </div>
    ${lobbyHTML(r.lobby)}
  `;
}

function lobbyHTML(lobby) {
  if (!lobby || !lobby.length) return '';
  return `
    <div class="section-title">Le lobby de cette partie</div>
    <div class="lobby-list">
      ${lobby.map(l => {
        const isCounter = l.counterRate !== null && l.counterRate >= 0.55 && l.encounters >= 4;
        return `<div class="lobby-row" data-counter="${isCounter}">
          <span class="lobby-placement ${l.placement <= 4 ? 'win' : 'loss'}">${l.placement}</span>
          ${l.carryIcon ? `<img class="lobby-carry" src="${l.carryIcon}" alt="${l.carry}" />` : ''}
          <div class="lobby-info">
            <div class="lobby-name">${l.riotId}</div>
            <div class="lobby-comp">${l.compLabel}</div>
          </div>
          ${isCounter ? `<span class="lobby-counter-tag" title="${l.encounters} rencontres en lobby partagé dans l'échantillon">Contre historiquement ta comp (${Math.round(l.counterRate * 100)}%)</span>` : ''}
        </div>`;
      }).join('')}
    </div>
    <div class="hint">Proxy de contre basé sur les lobbies partagés (qui a fini devant qui), pas un vrai combat round par round — Riot n'expose pas cette donnée. "Contre historiquement" affiché seulement au-delà de 4 rencontres observées.</div>
  `;
}

lookupButton.addEventListener('click', doLookup);
riotIdInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLookup(); });

document.getElementById('footer').textContent = 'CoreMeta · outil local, pas encore en ligne publiquement';
</script>
</body>
</html>
