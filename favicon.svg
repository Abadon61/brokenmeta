<?xml version="1.0" encoding="UTF-8"?>
<!-- Favicon d'onglet -- même tracé que couponicone clair/sombre carre.svg,
     fusionné en un seul fichier : sombre (marine) par défaut, blanc quand
     le navigateur/OS est en mode sombre. Les navigateurs modernes
     (Chrome, Firefox, Edge, Safari 16.4+) appliquent prefers-color-scheme
     à l'intérieur d'un favicon SVG, donc l'onglet s'adapte tout seul dans
     les deux sens sans fichier séparé. Les moteurs de recherche, eux, ne
     re-négocient pas le favicon par visiteur -- voir favicon-google.png,
     volontairement sourcé depuis la version sombre pour un fond clair. -->
<svg id="Calque_1" data-name="Calque 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <style>
      .cls-1 {
        fill: #0b0221;
      }
      .cls-2 {
        opacity: .5;
      }
      @media (prefers-color-scheme: dark) {
        .cls-1 {
          fill: #fff;
        }
      }
    </style>
  </defs>
