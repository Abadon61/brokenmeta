<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>WoW Forever — Carrousel tier list DPS niveau 60</title>
<link rel="stylesheet" href="brand.css">
<style>
  .hero-p { padding: 40px 44px; display: flex; align-items: center; gap: 36px; }
  .hero-p img { width: 190px; height: 190px; border-radius: 18px; border: 4px solid var(--rc); flex: none; }
  .hero-k { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: var(--pale); }
  .hero-n { font-family: 'Cal Sans', sans-serif; font-size: 54px; text-transform: uppercase; line-height: 1.05; margin: 10px 0 14px; }
  .hero-v { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 76px; line-height: 1; color: #fff; }
  .hero-v small { font-size: 24px; color: var(--text-faint); margin-left: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 28px; }
  .chip { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; color: var(--pale); border: 1px solid var(--border-bright); border-radius: 999px; padding: 10px 22px; background: rgba(42,99,255,.14); }
  .swipe { margin-top: 30px; font-family: 'Space Mono', monospace; font-size: 22px; color: var(--text-faint); letter-spacing: .08em; text-transform: uppercase; }
  .cover .hero-p { gap: 40px; padding: 56px 48px; }
  .cover .hero-p img { width: 250px; height: 250px; border-radius: 20px; }
  .cover .hero-k { font-size: 20px; }
  .cover .hero-n { font-size: 62px; margin: 12px 0 18px; }
  .cover .hero-v { font-size: 104px; }
  .cover .hero-v small { font-size: 30px; }
  .cover .chips { margin-top: 36px; gap: 16px; }
  .cover .chip { font-size: 24px; padding: 14px 28px; }
  .cover .swipe { margin-top: 38px; font-size: 25px; }
  .rows { padding: 22px 28px; display: flex; flex-direction: column; gap: 6px; }
  .rk { display: grid; grid-template-columns: 38px 56px 1fr; align-items: center; gap: 16px; padding: 6px 0; }
  .rk-n { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 24px; color: var(--text-faint); text-align: center; }
  .rk:first-child .rk-n { color: var(--gold); }
  .rk-i { width: 56px; height: 56px; border-radius: 10px; border: 2px solid var(--rc); display: block; }
  .rk-l { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 9px; }
  .rk-l b { font-weight: 600; font-size: 27px; color: var(--cream); }
  .rk-l span { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 24px; color: var(--pale); }
  .mv { display: grid; grid-template-columns: 88px 1fr auto; align-items: center; gap: 22px; padding: 22px 28px; margin-bottom: 16px; }
  .mv img { width: 88px; height: 88px; border-radius: 12px; border: 3px solid var(--rc); }
  .mv-n { font-family: 'Cal Sans', sans-serif; font-size: 32px; text-transform: uppercase; line-height: 1.1; }
  .mv-s { font-size: 23px; color: var(--text-dim); margin-top: 6px; }
  .mv-r { text-align: right; font-family: 'Space Mono', monospace; font-weight: 700; }
  .mv-r b { display: block; font-size: 38px; color: #fff; white-space: nowrap; }
  .mv-r span { font-size: 22px; }
  .up { color: var(--teal); } .down { color: #ff5a6b; } .flat { color: var(--text-faint); }
  .note { font-size: 22px; color: var(--text-dim); margin-top: 8px; line-height: 1.4; }
  .note strong { color: var(--cream); }
  .steps { padding: 30px 36px; display: flex; flex-direction: column; gap: 22px; }
  .st { display: flex; gap: 22px; align-items: baseline; font-size: 29px; line-height: 1.35; color: var(--text-dim); }
  .st b.n { font-family: 'Space Mono', monospace; color: var(--accent); font-size: 32px; flex: none; }
  .st strong { color: var(--cream); }
  .cta { margin-top: 26px; padding: 26px 34px; text-align: center; font-family: 'Cal Sans', sans-serif; font-size: 40px; text-transform: uppercase; background: var(--accent-btn); color: #fff; border-radius: 14px; box-shadow: 0 0 34px rgba(31,91,255,.5); }
  .cta small { display: block; font-family: 'Space Mono', monospace; font-size: 22px; text-transform: none; margin-top: 8px; opacity: .9; }
</style>
</head>
<body>
<div class="card" id="card" data-filename="carrousel-tierlist-dps">
  <div class="brand-header">
    <div class="brand-wordmark">
      <img class="icon" src="../logo/couponicone-clair-carre.png" alt="">
      <span class="wm"><span class="b1">Broken</span><span class="b2">Meta</span><span class="b3">.gg</span></span>
    </div>
    <div class="pill">WoW: Forever</div>
  </div>
  <div class="ribbon-wrap"><div class="ribbon-front" id="rib"></div></div>
  <div class="subtitle" id="sub"></div>
  <div class="content" id="body"></div>
  <div class="credit">Icônes © Blizzard Entertainment — BrokenMeta.gg n'est pas affilié à Blizzard. Simulation, pas de vrais logs.</div>
  <div class="brand-footer">
    <div class="lead">Plus d'infos sur <span class="wm"><span class="b1">Broken</span><span class="b2">Meta</span><span class="b3">.gg</span></span></div>
    <img class="favicon" src="../logo/couponicone-clair-carre.png" alt="">
  </div>
</div>
<div style="padding:24px;font-family:sans-serif"><button id="exportBtn" style="font-size:18px;padding:10px 20px;cursor:pointer">Exporter en PNG</button></div>

<script src="wow-common.js"></script>
<script>
  // Slides: ?s=1..5. Numbers: data/wow_ranking60.json (sim of 2026-11-10) vs data/wow_ranking60_prev.json (2026-11-09).
  var S = +(new URLSearchParams(location.search).get('s') || 1);
  var NAMES = ['01-couverture', '02-top10', '03-ce-qui-a-bouge', '04-bas-du-classement', '05-methode'];
  document.getElementById('card').dataset.filename = 'carrousel-tierlist-dps-' + NAMES[S - 1];
  // [spec_id, rang avant, DPS avant]
  var PREV = { warlock_affliction: [1, 1183.5], shaman_enhancement: [5, 1004.2], warlock_demonology: [13, 853.3], druid_balance: [12, 856.0], warrior_fury: [4, 1005.2] };
  function row(r) { return r; }
  window.__ready = WOW.digest.then(function (d) {
    var by = {}; d.dps.forEach(function (r, i) { r.rank = i + 1; r.label = r.label.replace('Equilibre', 'Équilibre').replace('Elémentaire', 'Élémentaire'); by[r.spec_id] = r; });
    var rib = document.getElementById('rib'), sub = document.getElementById('sub'), body = document.getElementById('body');
    if (S === 1) {
      var t = d.dps[0]; body.className = 'content cover';
      rib.textContent = 'TIER LIST DPS NIVEAU 60';
      sub.innerHTML = '<strong>20 spécialisations simulées</strong> sur WoW: Forever, mise à jour du ' + WOW.frDate(d.simulation.date) + '.';
      body.innerHTML = '<div class="panel hero hero-p" style="--rc:' + t.class_color + '"><img src="' + t.icon + '" alt="">' +
        '<div><div class="hero-k">N° 1 en dégâts</div><div class="hero-n">' + t.label.replace(' — ', '<br>') + '</div>' +
        '<div class="hero-v">' + WOW.n0(t.value) + '<small>DPS</small></div></div></div>' +
        '<div class="chips"><span class="chip">Top 10</span><span class="chip">Ce qui a bougé</span><span class="chip">Méthode</span></div>' +
        '<div class="swipe">Glisse pour voir le classement →</div>';
    } else if (S === 2) {
      var top = d.dps.slice(0, 10), max = top[0].value;
      rib.textContent = 'TOP 10 DPS NIVEAU 60';
      sub.innerHTML = 'Boss immobile, 3 minutes, <strong>bonus des ensembles Sanctified</strong> simulés.';
      body.innerHTML = '<div class="panel rows">' + top.map(function (r, i) {
        return '<div class="rk" style="--rc:' + r.class_color + '"><span class="rk-n">' + (i + 1) + '</span><img class="rk-i" src="' + r.icon + '" alt="">' +
          '<div><div class="rk-l"><b>' + r.label + '</b><span>' + WOW.n0(r.value) + ' DPS</span></div>' +
          '<div class="bar-wrap"><div class="bar-fill" style="width:' + (r.value / max * 100).toFixed(1) + '%"></div></div></div></div>';
      }).join('') + '</div>';
    } else if (S === 3) {
      rib.textContent = 'CE QUI A BOUGÉ';
      sub.innerHTML = 'Après les <strong>correctifs du 10 novembre</strong> et les bonus d\'ensemble.';
      var list = [['warlock_affliction', 'Était n° 1'], ['shaman_enhancement', 'Était n° 5'], ['warlock_demonology', 'Était n° 13'], ['druid_balance', 'Était n° 12']];
      body.innerHTML = list.map(function (x) {
        var r = by[x[0]], p = PREV[x[0]], pct = (r.value / p[1] - 1) * 100, cls = pct > 0.5 ? 'up' : pct < -0.5 ? 'down' : 'flat';
        return '<div class="panel mv" style="--rc:' + r.class_color + '"><img src="' + r.icon + '" alt="">' +
          '<div><div class="mv-n">' + r.label + '</div><div class="mv-s">n° ' + p[0] + ' → <strong style="color:#fff">n° ' + r.rank + '</strong></div></div>' +
          '<div class="mv-r"><b>' + WOW.n0(r.value) + '</b><span class="' + cls + '">' + WOW.pct1(pct) + '</span></div></div>';
      }).join('') + '<div class="note"><strong>Affliction</strong> et <strong>Amélioration</strong> reculent au classement : les autres spés progressent davantage.</div>';
    } else if (S === 4) {
      var bot = d.dps.slice(-5).reverse();
      rib.textContent = 'BAS DU CLASSEMENT';
      sub.innerHTML = 'Les 5 dernières spés en <strong>dégâts simulés</strong>.';
      var max2 = d.dps[0].value;
      body.innerHTML = '<div class="panel rows">' + bot.map(function (r) {
        return '<div class="rk" style="--rc:' + r.class_color + '"><span class="rk-n">' + r.rank + '</span><img class="rk-i" src="' + r.icon + '" alt="">' +
          '<div><div class="rk-l"><b>' + r.label + '</b><span>' + WOW.n0(r.value) + ' DPS</span></div>' +
          '<div class="bar-wrap"><div class="bar-fill" style="width:' + (r.value / max2 * 100).toFixed(1) + '%"></div></div></div></div>';
      }).join('') + '</div><div class="note"><strong>Mage Arcanes, Mage Feu et Paladin Vindicte</strong> : chiffres inchangés depuis la simulation du 9 novembre. Un faible DPS ne dit rien du reste (utilité, survie, donjons).</div>';
    } else {
      rib.textContent = 'COMMENT C\'EST CALCULÉ';
      sub.innerHTML = '<strong>Simulation, pas de vrais logs</strong> : chaque chiffre est reproductible.';
      body.innerHTML = '<div class="panel steps">' +
        '<div class="st"><b class="n">1</b><span><strong>Boss immobile</strong>, ' + d.simulation.fight_seconds / 60 + ' minutes de combat.</span></div>' +
        '<div class="st"><b class="n">2</b><span><strong>' + String(d.simulation.iterations).replace(/(\d)(?=(\d{3})$)/, '$1 ') + ' combats</strong> simulés par spécialisation.</span></div>' +
        '<div class="st"><b class="n">3</b><span><strong>Marge d\'erreur affichée</strong> pour chaque ligne du classement.</span></div>' +
        '<div class="st"><b class="n">4</b><span>Recalculé après chaque <strong>correctif de Blizzard</strong>.</span></div></div>' +
        '<div class="cta">Simule ta spé<small>brokenmeta.gg → WoW: Forever → Tier list</small></div>';
    }
  });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="export.js"></script>
</body>
</html>
