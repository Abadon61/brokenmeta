<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>WoW Forever — Tanks, menace par seconde</title>
<link rel="stylesheet" href="brand.css">
<style>
  .tanks { display: flex; flex-direction: column; gap: 18px; }
  .tank { padding: 24px 30px 30px; position: relative; overflow: hidden; }
  .tank > * { position: relative; }
  .tank-top { display: flex; align-items: center; gap: 22px; }
  .tank-top img { width: 88px; height: 88px; border-radius: 12px; border: 3px solid var(--rc); flex: none; }
  .tank-name { font-family: 'Cal Sans', sans-serif; font-size: 36px; text-transform: uppercase; line-height: 1.1; flex: 1; }
  .tank-val { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 66px; line-height: 1; color: #fff; text-align: right; }
  .tank-val small { display: block; font-size: 15px; letter-spacing: .12em; color: var(--text-faint); margin-top: 6px; }
  .tank .bar-wrap { margin-top: 18px; }
  .tank-meta { display: flex; gap: 34px; margin-top: 14px; font-family: 'Space Mono', monospace; font-size: 17px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .06em; }
  .tank-meta b { color: var(--cream); }
  .gap-panel { margin-top: 20px; padding: 22px 30px; display: flex; align-items: center; gap: 26px; }
  .gap-panel .big { flex: none; white-space: nowrap; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 64px; color: var(--teal); line-height: 1; }
  .gap-panel .txt { font-size: 26px; line-height: 1.3; color: var(--text-dim); }
  .gap-panel .txt strong { color: var(--cream); }
</style>
</head>
<body>
<div class="card" id="card" data-filename="brokenmeta-wow-tanks-menace">
  <div class="brand-header">
    <div class="brand-wordmark">
      <img class="icon" src="../logo/couponicone-clair-carre.png" alt="">
      <span class="wm"><span class="b1">Broken</span><span class="b2">Meta</span><span class="b3">.gg</span></span>
    </div>
    <div class="pill">WoW: Forever</div>
  </div>

  <div class="ribbon-wrap">
    <div class="ribbon-front">TANKS : LA MENACE</div>
  </div>
  <div class="subtitle">Menace par seconde <strong>simulée au niveau 60</strong> — un tank domine nettement.</div>

  <div class="content">
    <div class="tanks" id="tanks"></div>
    <div class="panel gap-panel" id="gap"></div>
  </div>

  <div class="credit">Icônes © Blizzard Entertainment — BrokenMeta.gg n'est pas affilié à Blizzard. Simulation, pas de vrais logs.</div>
  <div class="brand-footer">
    <div class="lead">Plus d'infos sur <span class="wm"><span class="b1">Broken</span><span class="b2">Meta</span><span class="b3">.gg</span></span></div>
    <img class="favicon" src="../logo/couponicone-clair-carre.png" alt="">
  </div>
</div>

<div style="padding:24px;font-family:sans-serif">
  <button id="exportBtn" style="font-size:18px;padding:10px 20px;cursor:pointer">Exporter en PNG</button>
</div>

<script src="wow-common.js"></script>
<script>
  window.__ready = WOW.digest.then(function (d) {
    var t = d.tanks, max = t[0].value;
    document.getElementById('tanks').innerHTML = t.map(function (r) {
      return '<div class="panel tank" style="--rc:' + r.class_color + '">' +
        '<div class="tank-top"><img src="' + r.icon + '" alt="">' +
        '<div class="tank-name">' + r.label + '</div>' +
        '<div class="tank-val">' + WOW.n0(r.value) + '<small>TPS</small></div></div>' +
        '<div class="bar-wrap"><div class="bar-fill" style="width:' + (r.value / max * 100).toFixed(1) + '%"></div></div>' +
        '<div class="tank-meta"><span>Santé <b>' + WOW.n0(r.health) + '</b></span><span>Dégâts subis/s <b>' + WOW.n0(r.dtps) + '</b></span></div>' +
        '</div>';
    }).join('');
    var vsPal = Math.round((t[0].value / t[1].value - 1) * 100), vsBear = Math.round((t[0].value / t[2].value - 1) * 100);
    document.getElementById('gap').innerHTML =
      '<div class="big">+' + vsPal + '%</div>' +
      '<div class="txt"><strong>de menace en plus</strong> que le Paladin Protection, et +' + vsBear + ' % face au Druide ours.</div>';
  });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="export.js"></script>
</body>
</html>
